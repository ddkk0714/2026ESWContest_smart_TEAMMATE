[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tof_logger/>
build_flags =
    -DDESKMATE_UART2_TX=1
    -DDESKMATE_FIRMWARE_VERSION=0x0110
lib_deps =
    https://github.com/DFRobot/DFRobot_HumanDetection.git#f98f64ea8bc29a9bb0fbb1624401ce8db126f966
    sensirion/Sensirion I2C SCD4x@1.1.0
    claws/BH1750@1.3.0
    adafruit/DHT sensor library@1.4.6

; ToF 학습 데이터 수집 전용(운영 아님). VL53L8CX 8×8 원본 + 규칙 판정을 USB 로 PC 에 보낸다.
; pio run -e tof_logger -t upload  →  dataset/tof_logger/README.md
[env:tof_logger]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_src_filter = +<tof_logger/> +<preprocess/tof/>
build_flags =
    -DDESKMATE_TOF_MAX_ZONES=64
    -DDESKMATE_FIRMWARE_VERSION=0x0110
lib_deps =
    stm32duino/STM32duino VL53L8CX@2.1.0

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<sensors/environment/EnvironmentValidation.cpp>
    +<sensors/environment/EnvironmentPayload.cpp>
    +<sensors/c1001/DrowsyDetector.cpp>
    +<preprocess/tof/TofPosture.cpp>
    +<tof_logger/TofLine.cpp>
build_flags =
    -std=gnu++17

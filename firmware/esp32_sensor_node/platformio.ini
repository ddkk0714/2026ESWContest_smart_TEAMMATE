[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tof_logger/>
; ToF: VL53L8CX 8x8 두 개를 이어 붙인 16x8(또는 8x16) 격자. 방향·배치는 실기 확인 뒤
; -DDESKMATE_TOF_FLIP_ROWS/FLIP_COLS/STACK_ROWS/SWAP 로 고정한다(src/main.cpp 위쪽, 기본값 포함).
; 10-19 지그 장착 뒤 손 테스트: 왼쪽 모듈 = 센서 0(A). 위아래가 뒤집혀 FLIP_ROWS=1. 좌우는 기본 FLIP_COLS=1 이 맞다
; (사진 규약: 열 0 = 센서가 보는 왼쪽 = 사람의 오른쪽. 왼팔을 옆으로 뻗으면 A 의 오른쪽 열에 28~40 cm 로 나와야 한다.
;  FLIP_COLS=0 으로 구워 보니 왼쪽 열에 나와 거울상이었음 → 1 로 복귀).
; 10-22 USB 직결 재장착 뒤 실기: 좌우가 거울상 → FLIP_COLS=0 (esp32dev·esp32dev_usb 둘 다). 방향은 펌웨어가 적용하고 0x05 flags 로 알리므로 받는 쪽(중계기·서비스)은 안 뒤집는다.
build_flags =
    -DDESKMATE_UART2_TX=1
    -DDESKMATE_FIRMWARE_VERSION=0x0123
    -DDESKMATE_TOF_MAX_ZONES=128
    -DDESKMATE_TOF_COUNT=2
    -DDESKMATE_TOF_FLIP_ROWS=1
    -DDESKMATE_TOF_FLIP_COLS=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/DFRobot/DFRobot_HumanDetection.git#f98f64ea8bc29a9bb0fbb1624401ce8db126f966
    sensirion/Sensirion I2C SCD4x@1.1.0
    claws/BH1750@1.3.0
    adafruit/DHT sensor library@1.4.6
    stm32duino/STM32duino VL53L8CX@2.1.0

; USB 직결 운영(10-22): ESP32 USB-C 를 Pi 4 USB-A 에 꽂는다. UART2 와 같은 COBS+CRC 프레임(0x03/0x04/0x05/0x10/0x20/0xF0)을
; USB Serial 로도 낸다. USB 로는 JSON 진단이 안 나오고 한 글자 명령도 안 받는다(src/main.cpp DESKMATE_USB_FRAMES).
; Pi 4 쪽: rpi4_tof_deploy_20261017/relay (generic usb-serial + CH340 usbfs 설정) 가 /dev/ttyUSB0 을 읽는다.
; pio run -e esp32dev_usb -t upload --upload-port COM5   (PC 에 꽂아 굽고 Pi 4 로 옮긴다)
[env:esp32dev_usb]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tof_logger/>
build_flags =
    -DDESKMATE_UART2_TX=1
    -DDESKMATE_USB_FRAMES=1
    -DDESKMATE_FIRMWARE_VERSION=0x0125
    -DDESKMATE_TOF_MAX_ZONES=128
    -DDESKMATE_TOF_COUNT=2
    -DDESKMATE_TOF_FLIP_ROWS=1
    -DDESKMATE_TOF_FLIP_COLS=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/DFRobot/DFRobot_HumanDetection.git#f98f64ea8bc29a9bb0fbb1624401ce8db126f966
    sensirion/Sensirion I2C SCD4x@1.1.0
    claws/BH1750@1.3.0
    adafruit/DHT sensor library@1.4.6
    stm32duino/STM32duino VL53L8CX@2.1.0

; ToF 학습 데이터 수집 전용(운영 아님). VL53L8CX 8×8 ×2 격자 + 규칙 판정을 USB 로 PC 에 보낸다.
; pio run -e tof_logger -t upload  →  dataset/tof_logger/README.md
[env:tof_logger]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_src_filter = +<tof_logger/> +<preprocess/tof/> +<sensors/tof/TofArray.cpp>
build_flags =
    -DDESKMATE_TOF_MAX_ZONES=128
    -DDESKMATE_TOF_COUNT=2
    -DDESKMATE_TOF_FLIP_ROWS=1
    -DDESKMATE_TOF_FLIP_COLS=0
    -DDESKMATE_FIRMWARE_VERSION=0x0123
lib_deps =
    stm32duino/STM32duino VL53L8CX@2.1.0

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<sensors/environment/EnvironmentValidation.cpp>
    +<sensors/environment/EnvironmentPayload.cpp>
    +<sensors/c1001/DrowsyDetector.cpp>
    +<preprocess/tof/TofPosture.cpp>
    +<sensors/tof/TofPayload.cpp>
    +<tof_logger/TofLine.cpp>
build_flags =
    -std=gnu++17

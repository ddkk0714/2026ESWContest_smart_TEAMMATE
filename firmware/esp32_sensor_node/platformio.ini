[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DDESKMATE_WARMUP_MS=30000UL
    -DDESKMATE_DROWSY_STILL_MS=120000UL
    -DDESKMATE_STILL_MOTION_LEVEL_MAX=15
    -DDESKMATE_UART2_TX=1
    -DDESKMATE_FIRMWARE_VERSION=0x0100
    -DDESKMATE_HAS_SCD41=0
    -DDESKMATE_HAS_BH1750=0
    -DDESKMATE_HAS_DHT22=0
lib_deps =
    ; not in the PlatformIO registry - pin the DFRobot GitHub tag instead
    https://github.com/DFRobot/DFRobot_HumanDetection.git#V1.0.1
    sensirion/Sensirion I2C SCD4x@0.4.0
    claws/BH1750@1.3.0
    adafruit/DHT sensor library@1.4.6

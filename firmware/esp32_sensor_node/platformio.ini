[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DDESKMATE_WARMUP_MS=30000UL
    -DDESKMATE_DROWSY_STILL_MS=120000UL
    -DDESKMATE_STILL_MOTION_LEVEL_MAX=15
lib_deps =
    dfrobot/DFRobot_HumanDetection@1.0.0
; Environment sensor candidates (drivers are intentionally stubbed for MVP):
;   sensirion/Sensirion I2C SCD4x@0.4.0
;   claws/BH1750@1.3.0
;   adafruit/DHT sensor library@1.4.6

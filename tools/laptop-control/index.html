<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESKMATE 책상 연결</title>
<style>
:root{font-family:"Malgun Gothic",sans-serif;color:#263b37;background:#f4f2eb}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid #d9dfd5;flex-wrap:wrap}h1{font-size:20px;margin:0 14px 0 0}button,input{font:inherit;border:1px solid #cbd5c8;border-radius:12px;padding:10px 14px;color:inherit;background:white}button{cursor:pointer}button.active,.primary{background:#356c59;color:white}button:disabled{opacity:.5;cursor:wait}input{width:170px}#note{margin-left:auto;font-size:13px;color:#687a72}main{padding:16px 24px}#remote{margin:auto;width:min(100%,calc((100vh - 145px)*1.70667))}#screen{display:block;width:100%;height:auto;aspect-ratio:1024/600;border-radius:20px;background:#e4e8df;box-shadow:0 8px 32px #263b3717;touch-action:none;user-select:none}#hint{text-align:center;color:#687a72;font-size:13px;margin:12px 0}iframe{width:100%;height:calc(100vh - 125px);border:0;border-radius:16px;background:#fff}#sensors{display:none}#sensorSetup{display:flex;gap:8px;align-items:center;margin-bottom:12px}#error{color:#9f4635;text-align:center;min-height:20px;font-size:14px}dialog{max-width:580px;border:0;border-radius:20px;padding:24px;line-height:1.7}dialog::backdrop{background:#0005}small{color:#687a72}
</style>
<header><h1>내 책상 연결</h1><button id="remoteTab" class="active">Pi5 화면</button><button id="sensorTab">센서 통합 보기</button><button id="openApp">앱 열기</button><button id="thinq">ThinQ 연결 상태</button><span id="note">Pi5 연결 확인 중</span></header>
<main><section id="remote"><img id="screen" alt="Pi5의 현재 화면" draggable="false"><p id="hint">화면을 클릭하면 터치돼요. 드래그·마우스 휠로 스크롤하고, Pi5 안의 키보드로 입력할 수 있어요.</p></section>
<section id="sensors"><div id="sensorSetup"><label for="pi4">Pi4 주소</label><input id="pi4" placeholder="예: 172.20.10.3" autocomplete="off"><button id="connect" class="primary">센서 연결</button><small>센서 값은 보드에서 받아 표시해요.</small></div><iframe id="sensorFrame" title="센서 통합 보기"></iframe></section><div id="error" role="status"></div></main>
<dialog id="thinqDialog"><h2>ThinQ 공기청정기</h2><p>인증 터미널에서 PAT를 숨김 입력한 후 연결해 주세요. 인증은 20분 동안 유지돼요.</p><p><button id="thinqConnect">인증 세션 연결</button> <button id="thinqRead">현재 상태 읽기</button></p><p id="thinqState">아직 연결하지 않았어요.</p><p><button id="thinqLow">약풍으로 변경</button> <button id="thinqAuto">자동으로 복원</button></p><section id="thinqApproval" hidden><p id="thinqProposal"></p><label><input type="checkbox" id="thinqOnline" style="width:auto"> 실제 기기가 켜져 있고 온라인이에요.</label><br><label><input type="checkbox" id="thinqUnchanged" style="width:auto"> 다른 앱이나 리모컨으로 설정을 바꾸지 않았어요.</label><p><button id="thinqExecute" class="primary">변경 승인</button></p></section><p><button id="thinqPhysical" hidden>실제 기기의 변경을 확인했어요</button></p><p id="thinqResult" role="status"></p><small>지원 모델: AIR_910604_WW / AS183HWWA. 자동 → 약풍 → 실제 확인 → 자동 복원 순서예요. 응답이 불확실하면 자동으로 다시 보내지 않아요.</small><p><button id="thinqRevoke">인증 세션 종료</button> <button id="closeInfo">닫기</button></p></dialog>
<script>
const token='__SESSION_TOKEN__';
const $=id=>document.getElementById(id);let current='remote',busy=false,down=null,imageUrl=null,stopped=false;
async function post(route,body={}){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Deskmate-Key':token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function error(message=''){$('error').textContent=message;}
async function action(route,body){if(busy)return;busy=true;$('screen').style.cursor='wait';try{await post(route,body);error();await new Promise(resolve=>setTimeout(resolve,550));await frame();}catch(e){error(e.message);}finally{busy=false;$('screen').style.cursor='pointer';}}
async function frame(){if(current!=='remote')return;const response=await fetch('/api/frame');if(!response.ok){const result=await response.json();throw Error(result.error);}const next=URL.createObjectURL(await response.blob());$('screen').src=next;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=next;$('note').textContent='Pi5 화면 연결됨';}
async function refresh(){while(!stopped){if(!busy&&current==='remote'){try{await frame();error();}catch(e){$('note').textContent='Pi5 응답 대기';error(e.message);}}await new Promise(resolve=>setTimeout(resolve,800));}}
function point(event){const r=$('screen').getBoundingClientRect();return{x:Math.max(0,Math.min(1023,Math.round((event.clientX-r.left)*1024/r.width))),y:Math.max(0,Math.min(599,Math.round((event.clientY-r.top)*600/r.height)))};}
$('screen').onpointerdown=e=>{if(busy||e.button!==0)return;e.preventDefault();down=point(e);$('screen').setPointerCapture(e.pointerId);};
$('screen').onpointerup=e=>{if(!down)return;const start=down;down=null;const end=point(e);action('/api/touch',{x1:start.x,y1:start.y,x2:end.x,y2:end.y});};
$('screen').onpointercancel=()=>down=null;
$('screen').addEventListener('wheel',e=>{e.preventDefault();if(busy)return;const p=point(e);const delta=e.deltaY>0?-240:240;action('/api/touch',{x1:p.x,y1:Math.max(260,Math.min(340,p.y)),x2:p.x,y2:Math.max(20,Math.min(579,Math.max(260,Math.min(340,p.y))+delta))});},{passive:false});
function tab(value){current=value;$('remote').style.display=value==='remote'?'block':'none';$('sensors').style.display=value==='sensors'?'block':'none';$('remoteTab').classList.toggle('active',value==='remote');$('sensorTab').classList.toggle('active',value==='sensors');error();}
$('remoteTab').onclick=()=>tab('remote');$('sensorTab').onclick=()=>{tab('sensors');if(!$('sensorFrame').src)$('sensorFrame').src='/sensors';};
$('openApp').onclick=()=>{tab('remote');action('/api/open');};
$('connect').onclick=async()=>{const button=$('connect');button.disabled=true;try{await post('/api/pi4',{host:$('pi4').value.trim()});await new Promise(resolve=>setTimeout(resolve,1700));$('sensorFrame').src='/sensors?t='+Date.now();error();}catch(e){error(e.message);}finally{button.disabled=false;}};
let thinqChallenge=null,thinqVerified=null,thinqBusy=false;
const statusText={read_ok:'현재 상태를 읽었어요.',approval_required:'30초 안에 확인하고 승인해 주세요.',state_match:'API 응답과 다시 읽은 상태가 일치해요. 실제 기기도 확인해 주세요.',outcome_unconfirmed:'변경 결과가 불확실해요. 실제 기기를 확인해 주세요. 다시 보내지 않아요.',blocked:'모델·현재 설정·승인 조건을 확인해 주세요. 최초 상태는 전원 켜짐, 청정, 자동이어야 해요.',api_error:'ThinQ 인증·네트워크·기기 연결을 확인해 주세요.',error:'요청을 안전하게 중단했어요.',user_attestation_recorded:'실제 기기 확인을 기록했어요.',session_revoked:'인증 세션을 종료했어요.'};
async function thinqWork(work){if(thinqBusy)return;thinqBusy=true;document.querySelectorAll('#thinqDialog button').forEach(b=>b.disabled=true);try{await work();}catch(e){$('thinqResult').textContent=e.message;thinqChallenge=null;$('thinqApproval').hidden=true;}finally{thinqBusy=false;document.querySelectorAll('#thinqDialog button').forEach(b=>b.disabled=false);}}
function thinqShow(r){$('thinqResult').textContent=statusText[r.status]||'인증 세션이 연결됐어요.';if(r.state){const fields=Object.entries(r.fields||{}).filter(([,v])=>v.valid).map(([k,v])=>k+': '+v.value).join(' · ');$('thinqState').textContent='전원 '+r.state.power+' · 모드 '+r.state.job+' · 바람 '+r.state.windStrength+(fields?' / '+fields:'');}if(r.status==='state_match'){thinqVerified=r.value;$('thinqPhysical').hidden=false;}if(r.status==='outcome_unconfirmed'){$('thinqLow').disabled=true;$('thinqAuto').disabled=true;}}
$('thinq').onclick=()=>$('thinqDialog').showModal();$('closeInfo').onclick=()=>$('thinqDialog').close();
$('thinqConnect').onclick=()=>thinqWork(async()=>{thinqShow(await post('/api/thinq/connect'));thinqShow(await post('/api/thinq/call',{op:'read'}));});
$('thinqRead').onclick=()=>thinqWork(async()=>thinqShow(await post('/api/thinq/call',{op:'read'})));
for(const [id,value] of [['thinqLow','LOW'],['thinqAuto','AUTO']])$(id).onclick=()=>thinqWork(async()=>{thinqChallenge=null;$('thinqApproval').hidden=true;const r=await post('/api/thinq/call',{op:'prepare',value});thinqShow(r);if(r.status==='approval_required'){thinqChallenge=r;$('thinqOnline').checked=false;$('thinqUnchanged').checked=false;$('thinqProposal').textContent=(value==='LOW'?'약풍으로 변경':'자동으로 복원')+'할까요?';$('thinqApproval').hidden=false;}});
$('thinqExecute').onclick=()=>thinqWork(async()=>{if(!thinqChallenge||!$('thinqOnline').checked||!$('thinqUnchanged').checked)throw Error('두 조건을 확인해 주세요.');const challenge=thinqChallenge;thinqChallenge=null;$('thinqApproval').hidden=true;thinqShow(await post('/api/thinq/call',{op:'execute',nonce:challenge.nonce,approved:true,physical_online_confirmed:true,no_external_change:true}));});
$('thinqPhysical').onclick=()=>thinqWork(async()=>{thinqShow(await post('/api/thinq/call',{op:'physical_confirmation',value:thinqVerified,approved:true}));$('thinqPhysical').hidden=true;});
$('thinqRevoke').onclick=()=>thinqWork(async()=>{thinqShow(await post('/api/thinq/call',{op:'revoke'}));thinqChallenge=null;thinqVerified=null;$('thinqApproval').hidden=true;$('thinqPhysical').hidden=true;});
fetch('/api/status').then(r=>r.json()).then(s=>{$('pi4').value=s.pi4||'';});refresh();window.addEventListener('pagehide',()=>stopped=true);
</script></html>

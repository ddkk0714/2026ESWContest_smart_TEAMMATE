# DESKMATE Pi 4 development broker.
# The listener is published only on Pi 4's private development-LAN address by
# the Docker command; never configure router port forwarding for this broker.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
# Authentication provisioning is intentionally kept out of source control.
# This temporary lab broker carries no raw ToF arrays, key contents, tokens,
# or credentials. Replace this with password_file + ACL before any untrusted
# shared-network deployment.
allow_anonymous true

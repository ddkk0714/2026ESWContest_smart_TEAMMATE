  - {kind: away, seconds: 10}
  - {kind: upright, seconds: 180, typing: true}
  - {kind: drowsy, seconds: 300, typing: false,
     nods: {interval_s: [6, 14], amp_deg: [25, 40], micro_sleep_p: 0.5, hold_s: [5, 15], first_s: [15, 30]}}
  - {kind: upright, seconds: 120, typing: true}

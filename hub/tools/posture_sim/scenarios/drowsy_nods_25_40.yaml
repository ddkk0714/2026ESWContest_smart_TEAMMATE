# 졸음 끄덕임 세기 25~40° — 자세 모델 drowsy 재현율과 0x03 졸음 플래그가 약한 끄덕임을 잡는지(10-23 미결: 25~40° 재현율 0~0.26).
#  깨어 타이핑 → 졸음 5 분 → 깸, 세 번. 첫 끄덕임 전은 upright 로 센다. 같은 묶음 drowsy_nods_15_25 · 25_40 · 40_55 를 시드별로 비교.
name: drowsy_nods_25_40
seed: 801
start_clock: "15:00"

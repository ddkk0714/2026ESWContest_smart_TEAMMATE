# 사람 반응 모델 — 전부 설정값(측정값 아님). 기본 < personas.<이름> < 각본 reaction: 순으로 덮인다.
defaults:
  # 화면 카드(hub interaction/request)에 대한 응답 확률. 나머지는 무응답(none, 카드 만료).
  card:
    posture_suggest: {accept: 0.60, reject: 0.10, none: 0.30}
    env_suggest:     {accept: 0.60, reject: 0.15, none: 0.25}
    break_suggest:   {accept: 0.40, reject: 0.30, none: 0.30}
    vent_suggest:    {accept: 0.55, reject: 0.15, none: 0.30}   # 환기(창문 열기) 권유 카드 — life_sim 계층
    bedtime_suggest: {accept: 0.50, reject: 0.25, none: 0.25}   # 취침 권유 카드 — 정책 규칙, life_sim 계층
  card_delay_s: [5, 60]
  card_attention: {sleepy: 0.5}        # 졸고 있을 때 카드를 보고 답할 확률 배수
  focus: {card_reject_add: 0.25}       # 몰입(FOCUS_*) 중이면 거절 확률 가산(방해)

  # 졸고 있을 때 채널별로 깨어날 확률. 여러 채널이면 1-Π(1-p).
  wake:
    screen_notice: 0.30     # 화면 알림(자동 posture_alert 의 표시)
    screen_card: 0.35
    lamp_cool: 0.45         # 무드등 차갑고 밝게
    lamp_bright: 0.40       # hub desk_lamp set_brightness 70
    lamp_warm: 0.05
    fan_on: 0.30
    fan_high: 0.50
    purifier: 0.00
    tts: 0.85               # 스피커 TTS
    sound: 0.60             # 알림음(personalize arm sound_cue)
    window_open: 0.20
  escalation: {wake_gain: 0.25}        # 같은 에피소드에서 n 번째 개입은 (1+gain·n) 배
  wake_delay_s: [3, 25]
  wake_transition_s: [0.6, 1.8]
  awake_s: [300, 900]                  # 깬 뒤 다시 조는 데 걸리는 시간(각본 구간이 아직 drowsy 면 재발)
  wake_typing: true

  # 턱괴기·거북목·숙임 알림에 자세를 고칠 확률과 유지 시간
  posture_fix:
    screen_notice: 0.50
    screen_card: 0.60
    tts: 0.70
    lamp_cool: 0.10
  posture_fix_delay_s: [3, 30]
  posture_hold_s: [240, 900]

  # 자동 실행 뒤 되돌리기(request_id 없는 reject)
  undo: {p: 0.05, delay_s: [5, 50], focus_disturb_add: 0.10}
  noise_reject: {fan_high: 0.30}       # 강풍 소음 → 되돌리기 가산

  # 휴식 권유를 받아 자리를 비우는 행동
  rest: {go_away_p: 0.5, delay_s: [20, 90], away_s: [180, 420]}

  # 잠재 피로(fatigue.py) — 켜면 졸음·자세 무너짐·키 입력 저하가 각본이 아니라 피로 F 에서 생긴다. [lo, hi] 는 사람마다 뽑는 범위.
  fatigue:
    enabled: false
    f0: [0.10, 0.30]                 # 세션 시작 피로(밤이면 +0.15)
    task_half_h: [0.9, 1.8]          # 책상 작업만으로 피로 0 → 0.5 까지(시간)
    rest_half_min: [10, 20]          # 자리를 비우면 피로가 절반이 되는 시간(분)
    co2: {from_ppm: 800, per_1000ppm: [0.4, 0.9]}          # 작업 피로 속도 가산 = (CO₂ − 800)/1000 × 이 값
    circadian: {dip_hours: [13, 16], dip_gain: [0.3, 0.7], night_from_h: 23.0, night_gain: [0.8, 1.6]}
    posture_gain: 0.2                # 턱괴기·거북목·숙임·기댐 중 가산
    dim: {below_lux: 200, gain: 0.3}
    hot: {above_c: 27.0, gain: 0.3}  # 체감 온도(선풍기 반영)
    alert: {wake_boost: [0.35, 0.6], self_wake_boost: [0.1, 0.25], tau_min: [6, 12], startle_drop: 0.05}
    drowsy: {s50: [0.58, 0.72], width: 0.05, max_rate_per_min: 0.5, typing_factor: 0.5, episode_mean_min: [3, 8], face_down_p: 0.25}
    slump: {s_from: 0.35, max_rate_per_min: 0.15, seconds: [60, 240], kinds: [turtle, chin_rest, lean_forward]}
    keys_gain: [0.35, 0.35, 0.08]    # idle_ratio·flight_cv·correction_rate 에 S × 이 값
    truth_threshold: 0.6             # 정답 fatigue = S ≥ 이 값(또는 졸음·엎드림)
    idle_after_s: 600                # 정답: 책상을 이만큼 비우면 rest → idle(hub absent_idle_sec 와 같은 뜻)

personas:
  default: {}
  student:        # 과제 중 대학생: 카드에 잘 답하지만 몰입 중 방해를 싫어함, TTS 에 잘 깸
    card:
      posture_suggest: {accept: 0.65, reject: 0.10, none: 0.25}
      break_suggest:   {accept: 0.35, reject: 0.35, none: 0.30}
    wake: {tts: 0.90, screen_notice: 0.35}
    rest: {go_away_p: 0.6}
  developer:      # 재택 개발자: 자동 실행 선호, 카드 무응답 많음, 선풍기 소음 거절
    card:
      posture_suggest: {accept: 0.45, reject: 0.10, none: 0.45}
      env_suggest:     {accept: 0.50, reject: 0.20, none: 0.30}
      break_suggest:   {accept: 0.30, reject: 0.30, none: 0.40}
    noise_reject: {fan_high: 0.50}
    focus: {card_reject_add: 0.35}
    wake: {screen_notice: 0.20, tts: 0.80}
  examinee:       # 필기 수험생: 키 입력 없음(비PC), 카드 수락률 높음, 휴식 권유는 거절 경향
    card:
      posture_suggest: {accept: 0.70, reject: 0.05, none: 0.25}
      env_suggest:     {accept: 0.70, reject: 0.10, none: 0.20}
      break_suggest:   {accept: 0.25, reject: 0.45, none: 0.30}
    wake: {lamp_cool: 0.55, tts: 0.85}
    rest: {go_away_p: 0.3}
    fatigue: {f0: [0.20, 0.40], task_half_h: [0.8, 1.5]}     # 수면 부족·긴 공부: 시작 피로↑, 빨리 지침

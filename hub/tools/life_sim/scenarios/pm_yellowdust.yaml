# 공기청정기 ① 황사 낮 (대학생, PC). 바깥 PM2.5 85(매우나쁨) → 창문 환기 제외(outdoor_pm_bad) → CO₂ 는 선풍기·카드만.
#  실내는 아침부터 나쁨(38)이고 닫힌 창 틈새로 계속 스민다. 볼 것: 켜기 지연, 몰입 중 상한(2), 점심 자리비움 때 한 단계 올림,
#  간식(PM 발생원) 때 올리기, 복귀 뒤 내리기 떨림, hub personalize 가 바깥 PM 을 모른 채 환기 카드를 내는지(→ 창문 열면 PM 급증).
name: pm_yellowdust
persona: student
seed: 401
start_clock: "13:30"
l8_params: v5
env: {co2_ppm: 650, temp_c: 22.0, humidity_pct: 40, lux: 420, pm25: 38}
weather: {temp_c: 16.0, humidity: 35, wind_ms: 3.0, condition: clear, season: spring, pm25: 85}
policy: {profile: none}
# 환경은 물리로(co2_to 강제 없음): CO₂·온습도·조도가 방 모델(room.py) → SCD41·DHT22·BH1750 대역 → UART 0x10 으로 hub 에 들어간다.
segments:
  - {kind: away, seconds: 10}
  - {kind: upright, seconds: 330, typing: true}
  - {kind: upright, seconds: 900, typing: true, keys: {idle_ratio: 0.15, flight_cv: 0.30, correction_rate: 0.04}}
  - {kind: mouse_work, seconds: 600, typing: true, keys: {idle_ratio: 0.30, flight_cv: 0.40, correction_rate: 0.06}}
  # 간식(과자 부스러기·포장) — 실내 발생원
  - {kind: upright, seconds: 300, typing: false, env: {pm_add_per_s: 0.05}}
  - {kind: drowsy, seconds: 1200, typing: false,
     nods: {interval_s: [6, 14], amp_deg: [30, 50], micro_sleep_p: 0.5, hold_s: [5, 15], first_s: [20, 40]}}
  # 늦은 점심 — 20 분 자리비움(away boost)
  - {kind: away, seconds: 1200}
  - {kind: upright, seconds: 900, typing: true, keys: {idle_ratio: 0.3, flight_cv: 0.45, correction_rate: 0.07}}
  - {kind: turtle, seconds: 420, typing: true, keys: {idle_ratio: 0.3, flight_cv: 0.45, correction_rate: 0.07}}
  - {kind: upright, seconds: 300, typing: true}
  - {kind: away, seconds: 30, no_return: true}

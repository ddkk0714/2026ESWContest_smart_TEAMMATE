# 제어 모듈 설정 (hub/deskmate_hub/control). 임계값·쿨다운·대상은 코드에 두지 않는다.
# 스마트 플러그 실기 모델은 미선정(agent-briefing D11) — 지금은 MQTT `deskmate/control/cmd` 로 명령을 내보내고
# `deskmate/control/result` 로 결과를 받는 계약(data-spec §10)만 고정한다. 플러그 어댑터(실기)는 그 토픽을 구독해 구현한다.

enabled: true
adapter: mqtt            # mqtt = 명령을 토픽으로 발행하고 결과를 기다림 / mock = 프로세스 안에서 즉시 성공(시연·테스트)
result_timeout_sec: 15   # 이 시간 안에 결과가 없으면 timeout 으로 종료하고 FSM 은 MONITOR 로 진행
suggest_timeout_sec: 180 # 제안(0.45~0.75)에 사용자 응답이 없으면 expired 로 종료 (interaction/request 의 expires_in_s 와 맞춤)
undo_window_sec: 60      # 자동 실행 뒤 한 tick 이 지나도 이 시간 안에는 되돌릴 수 있다
# esm_log_path: logs/esm-custom.jsonl  # 기본은 logs/esm-<boot_id>.jsonl, 필요할 때만 지정
cooldown_sec: 300        # 같은 target 에 같은 operation 을 다시 보내기까지 최소 간격 (fsm timers.cmd_cooldown_sec 와 맞춤)
irreversible_operations: [set_power_off, power_cycle]   # 사용자 확인 없이는 실행하지 않는 동작

# 제어 대상(target_id): vent_fan(보조 환기팬·선풍기, set_power on|off) · desk_lamp(iLink 무드등, set_brightness 0~255)
#   · air_purifier(LG ThinQ 공기청정기, set_mode off|auto|low|mid|high — 2026-10-23. auto = 공기청정기 자체 PM 자동 운전,
#     high = 3단계 고정. CO₂ 를 못 내리므로 ACTION_ENV 기본 명령에는 넣지 않고 개인화 arm air_fan_up 만 쓴다).
# ACTION_ENV 진입 시 원인(cause)별로 내보낼 명령. 가역 동작만 둔다. undo_value 는 자동 실행 후 사용자가 거절했을 때 되돌리는 값.
actions:
  environment:
    # vent_fan 실물 = Pico 2 W 블루투스 선풍기(firmware/pico2w_ble_fan). Pi 5 앱이 블루투스 탭에서 고른 선풍기에 실행한다.
    # 받는 operation: set_power on|off · set_level 0~3(풍량) · set_speed 0~100 · set_mode normal|natural · set_timer 초.
    # 풍량으로 켜려면 예: {target_id: vent_fan, operation: set_level, value: 3, undo_value: 0}
    - {target_id: vent_fan, operation: set_power, value: "on", undo_value: "off"}
    - {target_id: desk_lamp, operation: set_brightness, value: 70, undo_value: 40}
  # ACTION_POSTURE(졸음 drowsy·face_down → 자세성 라우팅) 진입 시 깨우기 (2026-10-24). PC life_sim(devices.yaml) 의
  # posture_auto → lamp_cool 과 같은 뜻. 색온도(cool)는 Pi 5 어댑터(feedback_policy.dart)가 아직 set_brightness·set_power 만
  # 받아 밝기만 올린다. 개인화 정책이 기기 arm(spec)을 준 경우에는 그쪽이 우선이고, 이 묶음을 지우면 ACTION_POSTURE 는
  # 예전처럼 명령 없이(화면 카드만) 지나간다. undo_value 110 = personalize.yaml 조명 arm 의 되돌림 밝기와 같다.
  posture:
    - {target_id: desk_lamp, operation: set_brightness, value: 230, undo_value: 110}

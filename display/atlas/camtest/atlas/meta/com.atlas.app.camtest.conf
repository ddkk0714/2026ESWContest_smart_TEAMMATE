<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    DESKMATE camtest (com.atlas.app.camtest) - UART 접근 정책

    왜 필요한가:
      기본 정책(/usr/share/dbus-1/system.d/com.atlas.PeripheralManager1.conf)은
      perm_peripheral 그룹에게 EnablePeripheral / DisablePeripheral 두 개만 열어 주고,
      UART 객체의 Open/Read/Write/Close 는 root 만 통과시킨다. 그래서 앱이
      EnablePeripheral 까지는 성공하고 Open 에서 AccessDenied 로 막힌다.

        uart: EnablePeripheral(UART_ttyS0) 시도
        uart: Open(921600) 실패 org.freedesktop.DBus.Error.AccessDenied
              Rejected send message ... interface="com.atlas.PeripheralManager1.UART"

    무엇을 여는가:
      perm_peripheral 그룹(= appinfo.json 에 com.atlas.permission.privileged.peripheral
      을 선언한 앱만 들어간다)에게 PeripheralManager 의 UART 인터페이스 호출을 허용한다.
      다른 서비스·다른 인터페이스는 건드리지 않는다.

    되돌리려면:
      이 파일을 지우고 dbus 를 reload 한다. 원래 정책으로 돌아간다.

    두는 곳:
      /data/share/usr/share/dbus-1/system.d/com.atlas.app.camtest.conf
      (dbus system.conf 가 이 디렉터리를 includedir 로 읽는다. /data 는 쓰기 가능하고
       루트는 읽기 전용이라 여기가 유일하게 가능한 자리다.)
  -->
  <policy group="perm_peripheral">
    <allow send_destination="com.atlas.PeripheralManager1"
           send_interface="com.atlas.PeripheralManager1.UART"/>
  </policy>
</busconfig>

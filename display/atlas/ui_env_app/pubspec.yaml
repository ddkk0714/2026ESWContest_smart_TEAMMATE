name: deskmate_display
description: DESKMATE Raspberry Pi 5 Atlas status display.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  dbus: ^0.7.12
  # 자세 탭은 PR #20 의 camtest 판정·화면을 그대로 쓴다. 복사하면 갈라지므로
  # 같은 저장소의 그 앱을 패키지로 가져온다(camtest 의 테스트가 계속 지킨다).
  camtest:
    path: ../camtest
  # Atlas toolchain의 Dart 3.6.2 호환 상한. Dart 3.8 이상을 요구하는
  # 10.8.1+로 자동 상승하지 않도록 정확한 버전으로 고정한다.
  mqtt_client: 10.5.1
  audioplayers_atlas:
    path: /opt/flutter-atlas-plugins/packages/flutter-plugin-atlas-audioplayers

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/deskmate_test_music.mp3
    - assets/audio/chopin_nocturne_op9_no2.mp3
    - assets/audio/satie_gymnopedie_no1.mp3
    - assets/audio/beethoven_fur_elise.mp3
    - assets/audio/mozart_sonata_k545_allegro.mp3
    - assets/audio/bach_prelude_bwv846.mp3
    - assets/audio/CREDITS.md

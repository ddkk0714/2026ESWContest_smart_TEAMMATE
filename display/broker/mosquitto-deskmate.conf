# DESKMATE 브로커 설정 — 허브(Pi 4)의 mosquitto 에 넣는다.
#   sudo cp broker/mosquitto-deskmate.conf /etc/mosquitto/conf.d/
#   sudo systemctl restart mosquitto
#
# 리스너가 왜 둘인가:
#   1883 — ESP32 · PC collector · 네이티브 클라이언트용 (일반 MQTT over TCP)
#   9001 — ATLAS 디스플레이 web-app 용 (MQTT over WebSocket)
#          브라우저는 원시 TCP 소켓을 못 열어서 1883 에 직접 못 붙는다.
#          노션 「통신 아키텍처」 §3-1 에서 "Pi 5 UI 가 웹 기반이면 필요" 라고
#          보류해 둔 항목이 바로 이것이다. web-app 으로 확정되면서 필요해졌다.

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# 대회 데모용 폐쇄망 전제. 공개망에 두지 말 것.
# 인증을 붙일 때는 두 리스너 모두에 적용해야 한다 (9001 만 열려 있으면 우회된다).
allow_anonymous true

# 디스플레이가 재시작해도 현재 상태를 즉시 받도록 retain 을 쓴다 (docs/mqtt-topics.md)
persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type warning
log_type error
